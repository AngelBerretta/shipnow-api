# docker-compose.yml (opcional)
#
# Levanta la API + una instancia de MongoDB para probar todo junto
# localmente, sin depender de una base externa. No reemplaza al
# Dockerfile: docker-compose lo usa (build: .) para construir la imagen
# de la API.
#
# Uso:
#   docker compose up --build
#   docker compose down            # detiene y borra los contenedores
#   docker compose down -v         # además borra el volumen de Mongo

services:
  api:
    build: .
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    environment:
      PORT: ${PORT:-3000}
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/shipnow}
      NODE_ENV: ${NODE_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      JWT_SECRET: ${JWT_SECRET:-changeme}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      ENABLE_INTERNAL_ROUTES: ${ENABLE_INTERNAL_ROUTES:-false}
    depends_on:
      - mongo
    volumes:
      # Persisten fuera del contenedor: el filesystem del contenedor es
      # efímero (se pierde al recrearlo). Ver README, sección Docker.
      - ./logs:/app/logs
      - ./uploads:/app/uploads

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:

***REMOVED*** Levanta la API + una instancia de MongoDB para probar todo junto
***REMOVED*** localmente, sin depender de una base externa. No reemplaza al
***REMOVED*** Dockerfile: docker-compose lo usa (build: .) para construir la imagen
